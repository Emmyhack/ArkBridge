[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
# Warnings are not advisory in bridge code.
deny = "warnings"
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  # The captured real delivery the INV-06 fork test replays.
  { access = "read", path = "./test/fork" },
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

# Deep run used in CI nightly and before any release.
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 2000
depth = 256

[profile.ci]
verbosity = 3

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
sort_imports = true

[rpc_endpoints]
ark = "${ARK_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
# Ark runs Blockscout, which exposes an Etherscan-compatible verification API at
# /api and accepts verification without a key on the devnet. Verify with:
#   forge verify-contract --chain ark --verifier blockscout <address> <contract>
ark = { key = "${ARK_EXPLORER_API_KEY}", chain = 9000, url = "https://explorer-api.34.60.137.196.sslip.io/api" }
ethereum = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
